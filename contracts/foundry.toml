[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "reactive-lib/=lib/reactive-lib-omni/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
sepolia = "${SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"

[fmt]
line_length = 120
